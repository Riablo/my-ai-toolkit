# 项目配置示例：按项目实际情况编辑后放到 <源仓库>/.config/htask/config.toml。
# 这是 720yun_tour_editer 的示例，不要在其他项目直接运行这些命令。
# 全局配置 ~/.config/htask/config.toml 只允许 schema_version/init/dev/models；
# labels 和 iterations 仅允许在项目配置中声明。
schema_version = 2

# 公共初始化：每次建树只执行一次，所有模式都会执行。
init = [
  'cp "$SOURCE_DIR/.env.development.local" ./.env.development.local',
  'codegraph init',
  'pnpm install',
]

# dev 模式且最终没有选 Label 时使用；选了 Label 不会叠加此数组。
dev = ['pnpm run start']

# 表名就是 GitLab/GitHub 上的实际 Label 名称。
# 可选 0/1/多个；重复名称只执行一次，按首次选择顺序排列。
[labels.editor]
init = [] # 可选：公共 init 后执行的专属初始化（不是覆盖公共 init）
dev = ['pnpm run start']

[labels.c2v]
init = []
dev = ['pnpm run start:c2v-editor']

# Label 可以只用于 MR/PR 分类，不提供 init/dev。
# [labels.documentation]

# 精确匹配起点分支；--base origin/v6.1.0 也匹配 v6.1.0。
# prompt / labels 均可省略。显式 --label 替换默认值；--no-labels 清空。
[iterations."v6.1.0"]
prompt = "主要是做智能体编辑器 apps/c2v-editor"
labels = ["c2v"]

# 模型预设可写在全局或项目配置；项目按 agent/名称/字段覆盖全局。
# Pi model 使用 provider/model；Codex 使用原生模型 ID；
# Claude 使用别名（如 opus、sonnet）或完整模型名，thinking 对应 --effort（low~max）。
# [models.pi."my-preset"]
# model = "your-provider/your-model"
# thinking = "high"
# [models.codex."my-preset"]
# model = "your-model"
# thinking = "high"
# [models.claude."my-preset"]
# model = "opus"
# thinking = "high"

# 不涉及 Label 的项目：删除所有 labels/iterations 表，只保留需要的 init/dev/models。
# 所有 init 完成后，每组 dev 在独立 tab 中并行执行，组内命令串行。
# 无 init/dev 命令时不创建 Setup tab；htask 不等待服务启动成功。
